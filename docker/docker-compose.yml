networks:
  backend:
    driver: bridge


#list docker volumes only not local mounted volumes
volumes:
  ollama_data:
  fastapi_data:
  pgvector:
  qdrant_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
  redis_data:
