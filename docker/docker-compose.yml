services:
  #FastAPI App
  fastapi:
    build:
      context: ..
      dockerfile: docker/minirag/Dockerfile

    container_name: fastapi

    ports:
      - "8000:8000"
    
    volumes:
      - fastapi_data:/app/assets
    
    env_file:
      - ./env/.env.app

    networks:
      - backend

    restart: always

    depends_on:
      pgvector:
        condition: service_healthy

  #Nginix Reverse Proxy
  nginx:
    image: nginx:stable-trixie-perl

    container_name: nginx

    ports:
      - "80:80"
    
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    
    depends_on:
      - fastapi
    
    networks:
      - backend
    
    restart: always

  #PostgreSQL (PGVector)
  pgvector:
    image: pgvector/pgvector:0.8.2-pg18-trixie

    container_name: pgvector

    ports:
      - "5432:5432"

    volumes:
      - "pgvector:/var/lib/postgresql"

    env_file:
      - ./env/.env.postgres

    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

    networks:
      - backend

    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s #check every 5 secs
      timeout: 5s #consider failed if no response in 5 secs
      retries: 5 #retry 5 times before deciding failure
      start_period: 10s #wait 10 secs before starting check health

  #Qdrant (VectorDB)
  qdrant:
    image: qdrant/qdrant:v1.17

    container_name: qdrant

    ports:
      - "6333:6333"  
      - "6334:6334"
    
    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend
    
    restart: always

  #Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:v3.11.2

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    
    networks:
      - backend

    restart: always

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/consoles_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

  #Grafana (Prometheus Visualization)
  grafana:
    image: grafana/grafana:13.1.0-24866141508-ubuntu

    container_name: grafana

    ports:
      - "3000:3000"
    
    volumes:
      - grafana_data:/var/lib/grafana
    
    env_file:
      - ./env/.env.grafana
    
    depends_on:
      - prometheus
    
    networks:
      - backend

    restart: always
    

  #Node Exporter (Host Metrics)
  node-exporter:
    image: prom/node-exporter:v1.11.1

    container_name: node-exporter

    ports:
      - "9100:9100"
    
    volumes:
      - /proc:/host/proc:ro #process (ro for read-only)
      - /sys:/host/sys:ro #system
      - /:/rootfs:ro #root filesystem
    
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)" #rgex to exclude system path stuff from metrics
    
    networks:
      - backend

    restart: always

  #PostgreSQL Exporter (Postgres Metrics)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1

    container_name: postgres-exporter

    ports:
      - "9187:9187"

    env_file:
      - ./env/.env.postgres-exporter

    depends_on:
      - pgvector

    networks:
      - backend

    restart: always
  
